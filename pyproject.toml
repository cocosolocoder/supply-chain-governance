[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-governance"
version = "0.1.0"
description = "Local-first software supply-chain inventory and risk CLI"
requires-python = ">=3.11"

[project.scripts]
supply-guard = "supply_guard.cli:main"

[tool.setuptools]
packages = ["supply_guard"]
